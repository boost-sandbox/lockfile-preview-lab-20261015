name: Lockfile research probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - shell: bash
        run: |
          mkdir -p helper
          echo '{"name":"Workspace marker","runs":{"using":"composite","steps":[{"shell":"bash","run":"echo RESEARCH_WORKSPACE_MARKER"}]}}' > helper/action.yml
      - uses: boost-sandbox/lockfile-preview-actions-20261015/sibling@main
      - run: echo RESEARCH_PROBE_COMPLETE
