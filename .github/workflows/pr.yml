name: Fork research pr
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: boost-sandbox/lockfile-preview-actions-20261015/helper@main
      - name: Record trusted context
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_SHA: ${{ github.sha }}
          RUN_REF: ${{ github.ref }}
        run: |
          echo RESEARCH_BASE_PR
          printf '%s\n' "$EVENT" "$WORKFLOW_REF" "$WORKFLOW_SHA" "$RUN_SHA" "$RUN_REF"
